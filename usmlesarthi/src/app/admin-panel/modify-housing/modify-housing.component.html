<div class="card-body" [ngSwitch]="landing">
  <div *ngSwitchCase="'list'">
    <div *ngIf="loading; else loaded" class="text-center">
      Fetching the housings list...
    </div>
    <ng-template #loaded>
      <div class="card row" *ngIf="addNew">
        <div class="card-body">
          <div class="text-primary">
            Note: Please check the housing before adding a new one, as this will
            cause redundancy in our database.
          </div>
          <form class="m-2" ngNativeValidate>
            <div class="row mt-2">
              <label>Housing Name</label>
              <input
                class="form-control"
                type="text"
                name="name"
                id="name"
                [(ngModel)]="newRotation.title"
                required
              />
            </div>
            <div class="row mt-2">
              <label>City</label>
              <input
                class="form-control"
                type="text"
                name="city"
                id="city"
                [(ngModel)]="newRotation.city"
                required
              />
            </div>
            <div class="row mt-2">
              <label>State</label>
              <input
                class="form-control"
                type="text"
                name="state"
                id="state"
                [(ngModel)]="newRotation.state"
                required
              />
            </div>
            <div class="row mt-2">
              <label>ZIP Code</label>
              <input
                class="form-control"
                type="text"
                name="zipCode"
                id="zipCode"
                [(ngModel)]="newRotation.zipCode"
                required
              />
            </div>
            <div class="row mt-2">
              <label>Rent/Month</label>
              <input
                class="form-control"
                type="number"
                name="rent"
                id="rent"
                [(ngModel)]="newRotation.rent"
                required
              />
            </div>
            <div class="row mt-2">
              <label>Minimum length of stay (days)</label>
              <input
                class="form-control"
                type="number"
                name="minStay"
                id="minStay"
                [(ngModel)]="newRotation.minStay"
                required
              />
            </div>
            <div class="row mt-2">
              <label>Utilities included</label>
              <select
                class="form-control"
                name="utilities"
                id="utilities"
                [(ngModel)]="newRotation.utilities"
                required
              >
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>
            <div class="row mt-2">
              <label>Max # of guests allowed</label>
              <input
                class="form-control"
                type="number"
                name="guests"
                id="guests"
                [(ngModel)]="newRotation.guests"
                required
              />
            </div>
            <div class="row mt-2">
              <label># of bedrooms</label>
              <select
                class="form-control"
                name="bedrooms"
                id="bedrooms"
                [(ngModel)]="newRotation.bedrooms"
                required
              >
                <option value="Studio">Studio</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3+">3+</option>
              </select>
            </div>
            <div class="row mt-2">
              <label>Bathroom</label>
              <select
                class="form-control"
                name="bathroom"
                id="bathroom"
                [(ngModel)]="newRotation.bathroom"
                required
              >
                <option value="Private">Private</option>
                <option value="Shared">Shared</option>
              </select>
            </div>
            <div class="row mt-2">
              <label>Washer/Dryer included</label>
              <select
                class="form-control"
                name="washer"
                id="washer"
                [(ngModel)]="newRotation.washer"
                required
              >
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>
            <div class="row mt-2">
              <label>Kitchen</label>
              <select
                class="form-control"
                name="kitchen"
                id="kitchen"
                [(ngModel)]="newRotation.kitchen"
                required
              >
                <option value="Private">Private</option>
                <option value="Shared">Shared</option>
                <option value="Not included">Not included</option>
              </select>
            </div>
            <!-- <div class="row mt-2">
              <label>Room Size (sq.ft)</label>
              <input
                class="form-control"
                type="text"
                name="size"
                id="size"
                [(ngModel)]="newRotation.size"
                required
              />
            </div> -->
            <div class="row mt-2">
              <label>Kitchen appliances included</label>
              <input
                class="form-control"
                type="text"
                name="appliances"
                id="appliances"
                [(ngModel)]="newRotation.appliances"
                required
              />
            </div>
            <div class="row mt-2">
              <label>Public Transportation (within 2 miles)</label>
              <input
                class="form-control"
                type="text"
                name="publicTransport"
                id="publicTransport"
                [(ngModel)]="newRotation.publicTransport"
                required
              />
            </div>
            <div class="row mt-2">
              <label>WiFi included</label>
              <select
                class="form-control"
                name="wifi"
                id="wifi"
                [(ngModel)]="newRotation.wifi"
                required
              >
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>
            <div class="row mt-2">
              <label>Closest Hospitals/Clinis (within 5 miles)</label>
              <input
                class="form-control"
                type="text"
                name="hospitals"
                id="hospitals"
                [(ngModel)]="newRotation.hospitals"
                required
              />
            </div>
            <div class="row mt-2">
              <label>Rental Description</label>
              <input
                class="form-control"
                type="text"
                name="description"
                id="description"
                [(ngModel)]="newRotation.description"
                required
              />
            </div>
            <div class="row mt-2">
              <label>Payment Policy </label>
              <input
                class="form-control"
                type="text"
                name="policy"
                id="policy"
                [(ngModel)]="newRotation.policy"
                required
              />
            </div>
            <div class="row mt-2">
              <label>Landlord Name</label>
              <input
                class="form-control"
                type="text"
                name="landlordName"
                id="landlordName"
                [(ngModel)]="newRotation.landlordName"
                required
              />
            </div>
            <div class="row mt-2">
              <label>Landlord Email</label>
              <input
                class="form-control"
                type="email"
                name="email"
                id="email"
                [(ngModel)]="newRotation.email"
                required
              />
            </div>
            <div class="row mt-2">
              <label>Landlord Phone Number</label>
              <input
                class="form-control"
                type="text"
                name="phone"
                id="phone"
                [(ngModel)]="newRotation.phone"
                required
              />
            </div>
            <div class="row mt-2">
              <label>Full Housing Address</label>
              <input
                class="form-control"
                type="text"
                name="address"
                id="address"
                [(ngModel)]="newRotation.address"
                required
              />
            </div>
            <div class="row mt-2">
              <label>Photos Drive Link</label>
              <input
                class="form-control"
                type="text"
                name="housingLink"
                id="housingLink"
                [(ngModel)]="newRotation.driveLink"
              />
            </div>
            <div class="row mt-2">
              <button
                class="btn btn-success btn-block btn-outline-success"
                type="submit"
                (click)="addNewRotation()"
              >
                Add Housing To the Database
              </button>
            </div>
          </form>
        </div>
      </div>
      <div>
        <label> Write the housing's name you are looking for..</label>
        <input type="text" class="form-control" #rotationPrefix />
        <br />
        <div class="row">
          <div class="col">
            <button
              style="margin-right: 10px"
              class="btn btn-primary btn-outline-primary btn-md text-center float-left"
              (click)="fetchSome(rotationPrefix.value)"
            >
              Search
            </button>
          </div>
          <div class="col">
            <button
              class="btn btn-success btn-outline-success float-right"
              (click)="addNew = !addNew"
            >
              Add New Housing
            </button>
          </div>
        </div>
      </div>
      <div *ngIf="rotationsList.length">
        <label class="text-center"> See/Modify the existing housings.</label>
        <div class="table-responsive">
          <table class="table table-striped table-hover">
            <thead>
              <tr>
                <th scope="col">S.No</th>
                <th scope="col">Housing Name</th>
                <th scope="col">City</th>
                <th scope="col">State</th>
                <th scope="col">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let rotation of rotationsList; index as i">
                <td>{{ i + 1 }}</td>
                <td>{{ rotation.title }}</td>
                <td>{{ rotation.city }}</td>
                <td>{{ rotation.state }}</td>
                <td>
                  <button
                    class="btn btn-primary btn-outline-primary"
                    (click)="takeMeToRotation(rotation)"
                  >
                    Update
                  </button>
                  <button
                    class="btn btn-primary btn-outline-primary"
                    (click)="deleteRotation(rotation)"
                  >
                    Delete
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </ng-template>
  </div>
