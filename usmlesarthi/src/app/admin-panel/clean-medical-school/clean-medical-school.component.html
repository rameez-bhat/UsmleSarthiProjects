<div class="card-body">
  <div>
    <div *ngIf="loading; else loaded" class="text-center">
      Fetching the users list...
    </div>
    <ng-template #loaded>
      <button
        class="btn btn-primary btn-outline-primary btn-md text-center"
        (click)="fetchAll()"
      >
        Check all users (Don't press, not ready yet!)
      </button>
      <br />
      <div *ngIf="checkList.length">
        <label class="text-center"
          >This is a list of users with random medical school data.</label
        >
        <div class="table-responsive">
          <table class="table table-striped table-hover">
            <thead>
              <tr>
                <th scope="col">S.No.</th>
                <th scope="col">User Email</th>
                <th scope="col">Name</th>
                <th scope="col">Medical School (Name, Country)</th>
                <th scope="col">Select Medical School</th>
                <th scope="col">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let user of checkList; index as i">
                <td>{{ i + 1 }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.displayName }}</td>
                <td>{{ user.School }} ({{ user.schoolCountry }})</td>
                <td>
                  <ng-select
                    placeholder="Medical School"
                    id="medicalSchoolSelect"
                    name="user.selectedMedicalSchool"
                    [(ngModel)]="user.selectedMedicalSchool"
                    [items]="medicalSchoolOptions"
                    required
                  ></ng-select>
                  <input
                    *ngIf="user.selectedMedicalSchool == 'Other'"
                    type="text"
                    name="user.otherMedicalSchool"
                    class="form-control"
                    placeholder="Medical School Name"
                    [(ngModel)]="user.otherMedicalSchool"
                    [required]="user.selectedMedicalSchool == 'Other'"
                  />
                </td>
                <td>
                  <button
                    class="btn btn-primary btn-outline-primary"
                    (click)="saveSchool(user)"
                  >
                    Save
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </ng-template>
  </div>
</div>
